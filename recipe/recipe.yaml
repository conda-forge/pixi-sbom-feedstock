# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.0"

package:
  name: pixi-sbom
  version: ${{ version }}

source:
  url: https://github.com/millsks/pixi-sbom/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ab5618ebef736c01950285f558efc05d432c9b7f3968d9769a924996a6d1f565

build:
  number: 0
  script:
    - if: unix
      then: cargo auditable install --locked --bins --no-track --path . --root "$PREFIX"
      else: cargo auditable install --locked --bins --no-track --path . --root "%LIBRARY_PREFIX%"
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      # The osx_arm64 package is cross-compiled on an osx_64 runner, which
      # cannot execute the resulting binary ("Bad CPU type in executable").
      - if: build_platform == target_platform
        then:
          - pixi-sbom --version
          - pixi-sbom --help
  - package_contents:
      bin:
        - pixi-sbom
      strict: true

about:
  homepage: https://millsks.github.io/pixi-sbom/
  repository: https://github.com/millsks/pixi-sbom
  documentation: https://millsks.github.io/pixi-sbom/
  summary: Generate a CycloneDX or SPDX SBOM from a pixi.lock file
  description: |
    A pixi extension that writes a CycloneDX 1.6 / 1.7 or SPDX 2.3 / 3.0.1
    JSON Software Bill of Materials for one or more environments of a
    pixi.lock file, with licenses, PyPI identities and a license policy gate.
    Once installed with `pixi global install pixi-sbom`, pixi discovers the
    `pixi-sbom` executable on PATH and exposes it as `pixi sbom`.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - millsks
